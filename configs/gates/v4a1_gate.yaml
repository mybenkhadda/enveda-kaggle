  - id: G25
    description: pytest failures == 0
    results_key: pytest.failures
    condition: "== 0"

  - id: G26
    description: pytest errors == 0
    results_key: pytest.errors
    condition: "== 0"

  - id: G27
    description: warm s1 (HOST) wall time <= 60 seconds
    results_key: timing.warm_s1_seconds
    condition: "<= 60"

  - id: G28
    description: warm s1 (HOST) new similarity computations == 0
    results_key: timing.warm_s1_similarity_calls
    condition: "== 0"

  - id: G29
    description: warm s2 (DEV) wall time <= 60 seconds
    results_key: timing.warm_s2_seconds
    condition: "<= 60"

  - id: G30
    description: warm s2 (DEV) new similarity computations == 0
    results_key: timing.warm_s2_similarity_calls
    condition: "== 0"

  - id: G31
    description: warm s3 + s4 combined wall time <= 120 seconds
    results_key: timing.warm_s3_s4_seconds
    condition: "<= 120"
