# CASMI v2 (Class-1 + Class-2) -- Colab-first configuration.
#
# Loaded by `casmi.workspace.config.load_v2_config`.
#
#   SOURCE       /content/Enveda               git clone of github.com/mybenkhadda/enveda-kaggle (never on Drive)
#   PERSISTENCE  /content/drive/MyDrive/EnvedaCASMI   data + artifacts (tree: configs/drive_asset_map.yaml)
#   SCRATCH      /content/enveda_work          disposable staging / temporaries -- never the only copy of a result
#
# `paths:` = the PHYSICAL roots of `V2Paths` (casmi-v2-paths-4). Semantic artifact locations are derived from
# them in ONE place: src/casmi/workspace/artifact_registry.py. Every relative path is relative to `drive_root`.
# Overrides: ENVEDA_DRIVE_ROOT, ENVEDA_REPO_ROOT, ENVEDA_SCRATCH_DIR. Nothing here points at a local Windows path.

schema_version: casmi-v2-config-3

paths:
  drive_root: /content/drive/MyDrive/EnvedaCASMI
  repo_root: /content/Enveda
  scratch_dir: /content/enveda_work      # disposable local SSD

  raw_data_dir: data/raw                  # competition files (optional; test.parquet is NEVER a validation input)
  processed_dir: data/processed           # the five canonical inputs (see `inputs:`)
  interim_dir: data/interim               # legacy modules only; v2 notebooks never read it
  external_dir: data/external             # coconut/ and pubchem/ -- user-supplied, never downloaded by code
  bundle_dir: bundle                      # the COMPLETE frozen v2-A7 bundle (copied by scripts/copy_colab_assets_to_drive.ps1)
  candidate_db_dir: candidates            # = universe root: candidate_keys.npy bucket_offsets.json universe_manifest.json
                                          #   index/ formula_index/ buckets/ variants/ (+ stage A: standardized/ rejected/
                                          #   filtered_out/ _done/; reports: manifests/)
  embeddings_dir: embeddings
  checkpoints_dir: checkpoints
  predictions_dir: predictions
  reports_dir: reports
  cache_dir: cache
  experiments_dir: runs                   # append-only experiment records (records/*.json) + derived views

# the five canonical processed inputs (copied from Windows; see configs/drive_asset_map.yaml), relative to drive_root
inputs:
  train_spectrum_metadata: data/processed/train_spectrum_metadata.parquet
  connectivity_folds: data/processed/connectivity_folds.parquet
  structure_table: data/processed/structure_table.parquet
  dev_queries: data/processed/dev_queries.parquet
  molecule_mass_variants: data/processed/molecule_mass_variants.parquet

runtime:
  seed: 42
  deterministic: true
  num_workers: 2                          # Colab standard runtime has 2 vCPUs; raise on high-CPU runtimes
  amp: auto                               # auto | bf16 | fp16 | off  (auto: bf16 only where supported)
  torch_compile: false

# ---------------------------------------------------------------------------------------------
# Phase 2 -- hidden-like validation regimes
# ---------------------------------------------------------------------------------------------
validation:
  split_seed: 20261001                    # persisted with the regime table; never re-randomized per run
  regime_fractions: {C1: 0.34, C2: 0.33, C3: 0.33}   # of ELIGIBLE truth connectivities per fold
  hidden_scope: fold                      # fold: all hidden truths of a fold hidden at once (recommended)
  c1_reference_protocol: test_simulated_strict   # frozen protocol: self + T1 + T2 references excluded
  c1_min_truth_spectra: 2                 # truth needs >= 1 OTHER spectrum to be a Class-1 query
  c2_require_external_source: true        # C2 truth must also exist in a non-TRAIN source (see class2_split)
  max_queries_per_regime_per_fold: null   # optional cap for fast iterations (deterministic subsample)
  composite_weights_PROVISIONAL: {C1: 0.15, C2: 0.60, C3: 0.25}
  mass_bins_da: [0, 200, 300, 400, 500, 600, 800, 1000, 1500, 5000]
  pool_size_bins: [0, 1, 10, 25, 100, 500, 2000, 10000, 1000000000]

# ---------------------------------------------------------------------------------------------
# Phase 3 -- external structure universe
# ---------------------------------------------------------------------------------------------
universe:
  bucket_prefix_len: 1                    # connectivity-key prefix buckets (1 -> 26 buckets, 2 -> 676)
  chunk_records: 200000                   # standardization chunk size (resumable unit)
  n_jobs: -1                              # RDKit workers (-1 = all CPUs)
  max_source_ids_per_candidate: 20        # provenance list cap (full count kept in n_source_records)
  filters:
    apply_to_train: false                 # TRAIN structures keep the training contract (never filtered)
    min_exact_mass: 150.0
    max_exact_mass: 1200.0
    organic_only: true
    organic_elements: [C, H, N, O, S, P, F, Cl, Br, I, Si, B, Se]
    neutral_only: true
    single_component_only: true
  prefilter:                              # cheap pre-RDKit filter from the SOURCE formula column (formula_col in the source config)
    by_source_formula: true               # unparseable / missing formulas always pass to the real standardizer
    mass_margin_da: 1.0
  sources:                                # template = column mapping (casmi.candidates.sources.SourceConfig, relative to repo_root)
    - template: configs/v6/coconut_source.json
      file: data/external/coconut/coconut.csv   # relative to drive_root; a missing file is reported and skipped
    # - template: configs/v6/pubchem_source.json
    #   file: data/external/pubchem/pubchem_subset.csv

# ---------------------------------------------------------------------------------------------
# Phase 4 -- candidate recall
# ---------------------------------------------------------------------------------------------
recall:
  ppm_grid: [2, 3, 5, 10, 20]
  k_values: [25, 100, 500]
  exact_pool_counts: true                 # unique connectivities per window (slower than variant-row counts)
  gate_a:                                 # the Gate-A summary reported by notebook 13 (only when the C2 protocol is valid)
    recall_all_ppm: [2, 5, 10]            # C2 Recall@All at these tolerances
    recall_at_k_ppm: 5                    # C2 Recall@100 and Recall@25 at this tolerance
    pool_quantiles_ppm: 5                 # candidate-count median / p90 / p99 at this tolerance
    decision_ppm: 10                      # tolerance of the heuristic coverage / density decision

# C2 protocol validity (casmi.validation.c2_protocol): a TRAIN-only universe is NEVER a valid C2 universe
c2_protocol:
  min_external_candidates: 1              # >= this many structures from a non-TRAIN source (COCONUT / PubChem / ...)
  min_external_share: 0.0001              # and at least this share of the universe

# out-of-fold mass-error calibration diagnostics (casmi.validation.mass_calibration; notebook 13)
mass_calibration:
  group_cols: [instrument_type, adduct]   # offsets are estimated per group, with fallback to coarser groups
  min_group_size: 50                      # smaller groups fall back to the parent group (instrument_type), then global
  n_bootstrap: 200                        # bootstrap resamples for the median-offset confidence interval
  ppm_grid: [2, 3, 5, 10]                 # before / after recall + pool size at these tolerances

# ---------------------------------------------------------------------------------------------
# Phase 5 -- analog propagation baseline
# ---------------------------------------------------------------------------------------------
analog:
  bin_width_da: 0.1                       # = frozen similarity.bin_width_da
  peak_tol_da: 0.02                       # = frozen similarity.peak_tol_da
  intensity_power: 1.0                    # 1.0 = frozen representation (no transform)
  prefilter_top_n: 200                    # per channel (fragment cosine, neutral-loss cosine)
  rescore_top_n: 50                       # modified-cosine rescoring of the prefiltered union
  top_k_analogs: 10                       # analogs propagated to candidates
  same_polarity_only: true
  max_precursor_delta_da: 300.0
  query_batch_size: 64
  device: auto                            # auto | cpu | cuda (torch sparse prefilter on GPU if available)
  fingerprint: {radius: 2, n_bits: 2048}
  support_tanimoto_threshold: 0.5
  similarity_weight_power: 2.0
  candidate_ppm: 10.0                     # candidate pool window for analog features
  max_candidates_per_query: 2000          # nearest-by-ppm cap (logged, never silent)
