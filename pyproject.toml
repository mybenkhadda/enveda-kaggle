[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "casmi"
version = "0.1.0"
description = "Enveda CASMI 2026 preprocessing pipeline: schema-aware, memory-efficient, reusable across notebooks."
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "rdkit",
    "tqdm",
    "pyyaml",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["casmi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
